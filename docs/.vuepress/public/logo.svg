<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Vue3 Form Wizard">
  <title>Vue3 Form Wizard</title>
  <!-- Track connecting the steps -->
  <rect x="16" y="45" width="64" height="6" rx="3" fill="#e74c3c" opacity="0.22"/>
  <!-- Completed portion of the track -->
  <rect x="16" y="45" width="32" height="6" rx="3" fill="#e74c3c"/>
  <!-- Step 1: complete -->
  <circle cx="18" cy="48" r="13" fill="#e74c3c"/>
  <path d="M12.5 48.5l3.8 3.8 7.2-7.6" fill="none" stroke="#fff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 2: current -->
  <circle cx="48" cy="48" r="13" fill="#e74c3c"/>
  <circle cx="48" cy="48" r="4.5" fill="#fff"/>
  <!-- Step 3: upcoming -->
  <circle cx="78" cy="48" r="11.5" fill="#fff" stroke="#e74c3c" stroke-width="3" opacity="0.9"/>
</svg>
